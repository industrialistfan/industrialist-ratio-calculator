<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Industrialist Machine Calculator</title>
  <style>
    body {
      width: 100%;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      padding: 16px;
      background-color: #1e1e1e;
      color: #f0f0f0;
      margin: 0;
    }
    h3 {
      font-size: 16px;
      margin-top: 0;
      text-align: center;
      color: #4CAF50;
    }
    fieldset {
      border: 1px solid #444;
      border-radius: 4px;
      margin-bottom: 12px;
      padding: 10px;
    }
    legend {
      font-size: 12px;
      color: #4CAF50;
      font-weight: bold;
    }
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .input-group {
      flex: 1;
      margin-bottom: 8px;
    }
    label {
      display: block;
      font-size: 11px;
      margin-bottom: 3px;
      color: #aaa;
    }
    input {
      width: 100%;
      padding: 7px;
      box-sizing: border-box;
      background: #2d2d2d;
      border: 1px solid #444;
      color: white;
      border-radius: 3px;
      font-size: 12px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      margin-top: 6px;
    }
    button:hover {
      background-color: #45a049;
    }
    #result {
      margin-top: 15px;
      font-size: 13px;
      background: #2d2d2d;
      padding: 10px;
      border-radius: 4px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h3>Industrialist Ratio Tool</h3>
  
  <!-- Producer Machine Stats -->
  <fieldset>
    <legend>Producer Machine (Recipe Book)</legend>
    <div class="input-row">
      <div class="input-group">
        <label>Craft Time (s):</label>
        <input type="number" id="prodTime" placeholder="e.g. 2">
      </div>
      <div class="input-group">
        <label>Output Qty:</label>
        <input type="number" id="prodQty" placeholder="e.g. 1" value="1">
      </div>
    </div>
  </fieldset>

  <!-- Consumer Machine Stats -->
  <fieldset>
    <legend>Consumer Machine (Recipe Book)</legend>
    <div class="input-row">
      <div class="input-group">
        <label>Craft Time (s):</label>
        <input type="number" id="consTime" placeholder="e.g. 4">
      </div>
      <div class="input-group">
        <label>Input Needed Qty:</label>
        <input type="number" id="consQty" placeholder="e.g. 2" value="1">
      </div>
    </div>
  </fieldset>

  <!-- Desired Ratio Setup -->
  <fieldset>
    <legend>Desired Ratio Setup</legend>
    <div class="input-row">
      <div class="input-group">
        <label>Producers in Ratio:</label>
        <input type="number" id="ratioProd" value="1">
      </div>
      <div class="input-group">
        <label>Consumers in Ratio:</label>
        <input type="number" id="ratioCons" value="1">
      </div>
    </div>
  </fieldset>

  <!-- Target Consumers -->
  <div class="input-group">
    <label>How many target Consumers do you want to run?</label>
    <input type="number" id="targetConsumers" value="10">
  </div>

  <button id="calculateBtn">Calculate Machines Needed</button>

  <div id="result">Enter recipe details and desired ratio above</div>

  <script src="sidepanel.js"></script>
</body>
</html>
